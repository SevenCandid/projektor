services:
  - type: web
    name: projektor-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --chdir backend app:app"
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CLOUDINARY_URL
        sync: false
